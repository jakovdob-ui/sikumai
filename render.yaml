services:
  - type: web
    name: shulchan4
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: LS_API_KEY
        sync: false
      - key: LS_STORE_ID
        sync: false
      - key: LS_VARIANT_ID
        sync: false
      - key: LS_WEBHOOK_SECRET
        sync: false
