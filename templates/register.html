<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הרשמה — שולחן 4</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0f0f 0%,#1a1a2e 100%)}
  .card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:16px;padding:48px 40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{font-size:1.8rem;font-weight:900;color:#fff;text-align:center;margin-bottom:6px}
  .logo span{color:#e94560}
  .sub{font-size:0.85rem;color:#888;text-align:center;margin-bottom:36px}
  label{display:block;font-size:0.75rem;color:#888;margin-bottom:6px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  input{width:100%;padding:12px 16px;background:#0f0f1a;border:1.5px solid #2a2a4a;border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:18px;transition:border-color .2s}
  input[type="email"],input[type="password"]{direction:ltr}
  input:focus{outline:none;border-color:#e94560}
  .btn{width:100%;padding:14px;background:#e94560;color:#fff;font-weight:700;font-size:1rem;border:none;border-radius:8px;cursor:pointer;transition:background .2s;margin-top:4px}
  .btn:hover{background:#c73652}
  .err{color:#e94560;font-size:0.82rem;text-align:center;background:rgba(233,69,96,.1);border:1px solid rgba(233,69,96,.3);border-radius:6px;padding:10px;margin-bottom:16px}
  .free-badge{background:rgba(233,69,96,.1);border:1px solid rgba(233,69,96,.3);border-radius:8px;padding:12px 16px;text-align:center;margin-bottom:24px;font-size:0.88rem;color:#ccc}
  .free-badge strong{color:#e94560}
  .link-row{text-align:center;margin-top:20px;font-size:0.85rem;color:#888}
  .link-row a{color:#e94560;text-decoration:none}
  .link-row a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo">שולחן<span> 4</span></div>
  <div class="sub">הרשמה חינמית — מתחיל מיד</div>
  <div class="free-badge">✨ חשבון חינמי כולל <strong>3 סיכומים לחודש</strong></div>
  {% if error %}
  <div class="err">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <label>שם מלא</label>
    <input type="text" name="name" placeholder="ישראל ישראלי" required autofocus>
    <label>אימייל</label>
    <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
    <label>סיסמה (6+ תווים)</label>
    <input type="password" name="password" placeholder="••••••" required minlength="6" autocomplete="new-password">
    <button type="submit" class="btn">צור חשבון בחינם ←</button>
  </form>
  <div class="link-row">
    כבר יש לך חשבון? <a href="/login">כניסה</a>
  </div>
</div>
</body>
</html>
