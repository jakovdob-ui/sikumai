<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שכחתי סיסמה — שולחן 4</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0f0f 0%,#1a1a2e 100%)}
  .card{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:16px;padding:48px 40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{font-size:1.8rem;font-weight:900;color:#fff;text-align:center;margin-bottom:6px}
  .logo span{color:#7C3AED}
  .sub{font-size:0.85rem;color:#888;text-align:center;margin-bottom:8px}
  .desc{font-size:0.88rem;color:#aaa;text-align:center;margin-bottom:30px;line-height:1.6}
  label{display:block;font-size:0.75rem;color:#888;margin-bottom:6px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  input{width:100%;padding:12px 16px;background:#0f0f1a;border:1.5px solid #2a2a4a;border-radius:8px;color:#fff;font-size:0.95rem;margin-bottom:18px;transition:border-color .2s;direction:ltr}
  input:focus{outline:none;border-color:#7C3AED}
  .btn{width:100%;padding:14px;background:#7C3AED;color:#fff;font-weight:700;font-size:1rem;border:none;border-radius:8px;cursor:pointer;transition:background .2s}
  .btn:hover{background:#6D28D9}
  .success{color:#34d399;font-size:0.88rem;text-align:center;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);border-radius:8px;padding:14px;margin-bottom:20px;line-height:1.6}
  .link-row{text-align:center;margin-top:20px;font-size:0.85rem;color:#888}
  .link-row a{color:#a78bfa;text-decoration:none}
  .link-row a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo">שולחן<span> 4</span></div>
  <div class="sub">פלטפורמת סיכומי שיעור AI</div>
  <div class="desc">הזן את כתובת האימייל שלך ונשלח קישור לאיפוס הסיסמה</div>

  {% if msg %}
  <div class="success">📧 {{ msg }}</div>
  {% else %}
  <form method="POST">
    <label>אימייל</label>
    <input type="email" name="email" placeholder="you@example.com" required autofocus>
    <button type="submit" class="btn">שלח קישור לאיפוס ←</button>
  </form>
  {% endif %}

  <div class="link-row">
    <a href="/login">← חזרה לכניסה</a>
  </div>
</div>
</body>
</html>
